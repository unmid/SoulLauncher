# Soul Launcher — Cargo workspace.
# The whole workspace shares a single version, defined here under
# [workspace.package]. Member crates inherit it with `version.workspace = true`.
[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-only"
repository = "https://github.com/unmid/SoulLauncher"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
